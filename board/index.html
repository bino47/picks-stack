<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picks board</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#16201a;--muted:#667068;--line:#e3dfd4;--soft:#f1eee6;
--fd:#0b6fe0;--fdink:#fff;--ok:#1b7442;--okbg:#e2f1e7;--bad:#b42318;--badbg:#fbe8e6;
--warn:#8a5a00;--warnbg:#fbf0d5;--chip:#ebe7dc;--shadow:0 1px 2px rgba(20,32,26,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e110f;--card:#171b18;--ink:#e7ece7;
--muted:#97a198;--line:#28302a;--soft:#1c211d;--fd:#3b8fff;--ok:#5cc489;--okbg:#13281b;
--bad:#ff8a7e;--badbg:#311714;--warn:#e7b44f;--warnbg:#2b2210;--chip:#222823;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:19px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.bank{text-align:right;white-space:nowrap}.bank b{font-size:17px;display:block}
.bank span{color:var(--muted);font-size:11.5px}
.livepnl{display:block;margin-top:4px;font-size:12px;font-weight:650;color:var(--muted)}
.livepnl.pos{color:var(--ok)}.livepnl.neg{color:var(--bad)}
.bankbox{margin:8px 0 0;text-align:right}.bankbox label{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.bankbox input{width:90px;padding:4px 6px;border:1px solid var(--line,#d8d4c8);border-radius:6px;background:var(--card,#fff);color:inherit;font:600 13px ui-monospace,Menlo,Consolas,monospace;text-align:right}
.bankbox .subb{display:block;font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.bankbox.off{display:none}
#banktog{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#banktog:hover{color:inherit}
.amt .real{color:var(--muted);font-size:11px;font-weight:400;margin-left:3px}
.boost{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.boost input{width:auto;accent-color:var(--ok)}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:10px 0 0;
padding:7px 10px;border-radius:8px;background:var(--soft);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.live .dot{background:var(--ok)}.status.down{background:var(--badbg);color:var(--bad)}
.status.down .dot{background:var(--bad)}
nav{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
font:inherit;font-weight:650;font-size:14px;padding:9px 4px 10px;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
nav .n{display:inline-block;min-width:19px;padding:0 6px;margin-left:4px;border-radius:10px;
background:var(--chip);font-size:12px;line-height:19px}
nav button.on .n{background:var(--ink);color:var(--bg)}
.sel{margin-top:8px;font-size:13px;color:var(--muted)}
.sel select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);
background:var(--card);color:var(--ink)}.sel a{color:var(--fd);margin-left:8px}
section{padding-top:12px}
.note{font-size:12.5px;color:var(--muted);margin:2px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
margin:0 0 12px;box-shadow:var(--shadow)}
.card.off{opacity:.92}
details.watch{margin:14px 0 12px;border:1px dashed var(--line);border-radius:12px;padding:0}
details.watch summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:14px;font-weight:650;color:var(--muted)}
details.watch summary::-webkit-details-marker{display:none}
details.watch summary:before{content:"▸ ";display:inline-block;transition:transform .15s}
details.watch[open] summary:before{transform:rotate(90deg)}
details.watch[open] summary{border-bottom:1px solid var(--line)}
details.watch .note{padding:0 14px}
details.watch article.card{margin:0 14px 12px}
.when{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.when b{color:var(--ink);font-weight:650}.soon{color:var(--warn);font-weight:700}
.match{font-size:17px;font-weight:750;margin-top:4px;letter-spacing:-.01em}
.match i{font-style:normal;color:var(--muted);font-weight:500;font-size:14px;margin:0 3px}
.fdn{font-size:12px;color:var(--muted);margin-top:1px}
.legs{margin-top:8px}.leg{padding:7px 0;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}.leg .lt{display:flex;justify-content:space-between;gap:10px}
.leg .lt b{font-size:15.5px}.leg .px{font-weight:650;font-variant-numeric:tabular-nums}
.f.two{grid-template-columns:1fr 1fr}
.pick{display:flex;align-items:center;gap:10px;margin:11px 0 0;padding:10px 12px;border-radius:9px;
background:var(--soft)}
.pick .mk{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.06em;
color:var(--muted)}
.pick .sd{font-size:16.5px;font-weight:750;flex:1}.pick .px{font-weight:650;font-variant-numeric:tabular-nums}
.pick .amt{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.why{margin-top:9px;font-size:12.5px;padding:7px 9px;border-radius:7px;background:var(--warnbg);
color:var(--warn)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;
border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;
font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;flex:1}
.btn.fd{background:var(--fd);border-color:var(--fd);color:var(--fdink)}
.btn.b365{background:#14841d;border-color:#14841d;color:#fff}
.btn.dk{background:#0e7a4e;border-color:#0e7a4e;color:#fff}
.btn.mg{background:#b08d3c;border-color:#b08d3c;color:#fff}
.btn.bga{background:#7a1f8f;border-color:#7a1f8f;color:#fff}
.bk{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:9px;margin-left:6px;background:var(--chip);color:var(--ink)}
.bk.mg{background:#b08d3c;color:#fff}
.bk.bga{background:#7a1f8f;color:#fff}
.bk.fb{background:#2f6b3a;color:#fff}
.bk.b365{background:#14841d;color:#fff}
.bk.dk{background:#0e7a4e;color:#fff}
.bk.sc{background:#5b3f9c;color:#fff}
.bk.tt{background:#9a4a14;color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{color:var(--muted)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:32px;font-size:12.5px;padding:0 10px;flex:none}
.bknav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px;position:sticky;top:0;z-index:5;
background:var(--bg);padding:4px 0}
.bknav .chip{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);
background:var(--card);color:var(--muted);font:inherit;font-weight:700;font-size:12.5px;
cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.bknav .chip .n{background:var(--chip);border-radius:8px;padding:0 6px;font-size:11px;font-variant-numeric:tabular-nums}
.bknav .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bknav .chip.on .n{background:rgba(255,255,255,.22)}
.bknav .chip.mg.on{background:#b08d3c;border-color:#b08d3c;color:#fff}
.bknav .chip.bga.on{background:#7a1f8f;border-color:#7a1f8f;color:#fff}
.bknav .chip.b365.on{background:#14841d;border-color:#14841d;color:#fff}
.bknav .chip.fd.on{background:var(--fd);border-color:var(--fd);color:var(--fdink)}
form.place{margin-top:10px;padding:12px;border-radius:9px;border:1px dashed var(--line)}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f label{font-size:11.5px;color:var(--muted);font-weight:650}
.f input{width:100%;margin-top:3px;font:inherit;font-size:16px;padding:8px 9px;border-radius:7px;
border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.all{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.all .btn{flex:none}.all span{font-size:12px;color:var(--muted)}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}.item .l{min-width:0}.item .t{font-weight:700}
.item .s{font-size:12.5px;color:var(--muted)}.item .r{text-align:right;white-space:nowrap}
.item .r.slbtns{white-space:normal;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.res{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:10px;
background:var(--chip);color:var(--muted)}
.res.win{background:var(--okbg);color:var(--ok)}.res.loss{background:var(--badbg);color:var(--bad)}
.pnl{font-weight:750;font-variant-numeric:tabular-nums;margin-top:3px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.model-tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:650;background:rgba(127,127,127,.10);color:var(--muted)}
.model-tag.good{background:rgba(35,180,90,.14);color:var(--ok)}
.model-tag.bad{background:rgba(220,60,60,.12);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:11.5px;color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
td:first-child,th:first-child{text-align:left}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;z-index:9;
background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;
font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none}
#toast.bad{background:var(--bad);color:#fff}
@media (max-width:380px){.f{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<header>
 <div class="hd"><div><h1 id="who">FanDuel board</h1><div class="sub" id="sub">eBasketball H2H &middot; FanDuel</div></div>
 <div class="bank"><b id="bank">&nbsp;</b><span id="cap">&nbsp;</span><span id="livebk">&nbsp;</span>
  <span id="livepnl" class="livepnl" title="Live P&amp;L on your placed bets, from real results">&nbsp;</span></div>
  <button id="banktog" type="button" aria-expanded="true">Bankroll <span id="bankcar">&#9662;</span></button>
  <div class="bankbox"><label>FanDuel bankroll ($)<input id="fdbank" inputmode="decimal" autocomplete="off" placeholder="enter to scale"></label>
  <label>BetMGM bankroll ($)<input id="mgmbank" inputmode="decimal" autocomplete="off" placeholder="enter to scale"></label>
  <label>Borgata bankroll ($)<input id="bgabank" inputmode="decimal" autocomplete="off" placeholder="enter to scale"></label>
  <label>bet365 bankroll ($)<input id="b365bank" inputmode="decimal" autocomplete="off" placeholder="enter to scale"></label>
    <label class="boost"><input id="boost15" type="checkbox">×1.5 suggested bets</label>
    <span id="scaleinfo" class="subb"></span></div></div>
 <div id="status" class="status"><span class="dot"></span><span id="stxt">Loading&hellip;</span></div>
 <div id="sel" class="sel" hidden></div>
 <nav><button data-tab="bets" class="on">To place<span class="n" id="nb">0</span></button>
 <button data-tab="b365">bet365<span class="n" id="n365">0</span></button>
 <button data-tab="tt">Table tennis<span class="n" id="ntt">0</span></button>
 <button data-tab="placed">Placed<span class="n" id="np">0</span></button>
 <button id="nav-convert" data-tab="convert" hidden>Convert</button>
 <button data-tab="record">Record</button></nav>
</header>
<section id="v-bets"></section>
<section id="v-b365" hidden></section>
<section id="v-tt" hidden></section>
<section id="v-placed" hidden></section>
<section id="v-convert" hidden></section>
<section id="v-record" hidden></section>
</main><div id="toast"></div>
<script>
(function(){
"use strict";
var Q = new URLSearchParams(location.search), PID = Q.get("p");
// The page lives under its secret link (/p/<token>/ or /a/<token>/); every call stays under it.
var LM = location.pathname.match(/^\/(p|a)\/[A-Za-z0-9_-]+/), BASE = LM ? LM[0] : "";
var QS = PID ? "?p=" + encodeURIComponent(PID) : "";
var DATA = null, REC = null, TAB = "bets", OPEN = {}, EDIT = {}, BUSY = false, recAt = 0, LOCKED = null;
var MYBANK_FD = null, MYBANK_MGM = null, MYBANK_BGA = null, MYBANK_B365 = null, BOOST15 = false;
var CONV_FAV = "", CONV_DOG = "", CONV_K = "";
try { MYBANK_FD = localStorage.getItem("pb-fdbank"); } catch (e) {}
try { MYBANK_MGM = localStorage.getItem("pb-mgmbank"); } catch (e) {}
try { MYBANK_BGA = localStorage.getItem("pb-bgabank"); } catch (e) {}
try { MYBANK_B365 = localStorage.getItem("pb-b365bank"); } catch (e) {}
// collapsible bankroll box (phone-friendly): collapsed by default on small
// screens; a manual toggle is remembered across visits.
(function(){
  var box = document.querySelector(".bankbox"), tog = document.getElementById("banktog");
  if (!box || !tog) return;
  var pref = null; try { pref = localStorage.getItem("pb-bankbox"); } catch (e) {}
  var off = pref !== null ? pref === "1" : window.innerWidth < 720;
  function apply(){
    box.classList.toggle("off", off);
    tog.setAttribute("aria-expanded", off ? "false" : "true");
    var c = document.getElementById("bankcar"); if (c) c.textContent = off ? "\u25B8" : "\u25BE";
  }
  tog.addEventListener("click", function(){
    off = !off;
    try { localStorage.setItem("pb-bankbox", off ? "1" : "0"); } catch (e) {}
    apply();
  });
  apply();
})();
try { BOOST15 = localStorage.getItem("pb-boost15") === "1"; } catch (e) {}
// Scale every displayed stake so the bet keeps the same EV *proportion* of the
// bankroll. Source bankroll -> your bankroll; a $160 bet on a $7000 bankroll
// becomes ~$2.29 on a $100 bankroll. Display only: the data and the maths are
// untouched, and the "Amount accepted" field still lets you type the real one.
// Bankroll scaler — ONE simple ratio. The suggested stake already has EV/sizing
// baked in; the scaler just shrinks it to fit YOUR bankroll. ratio = mine / TOTAL,
// where TOTAL = 7000 + 5000 = 12000 (the whole source pot, both sports).
//   scaled = suggested * mine / 12000
// At mine=1200: ratio=0.1 -> a $100 suggestion shows $10, a $500 shows $50.
// Same ratio for EVERY number (basketball, soccer, everything). Display only.
function totalPot(p){
  return (Number(p && p.bankroll) || 0)
       + (Number(p && p.fifaBankroll) || 0)
       + (Number(p && p.nflBankroll) || 0);
}
// Scale by BOOK, not league. Each bet's suggested stake is shrunk by the bankroll
// you stored for THAT book (FanDuel vs BetMGM vs Borgata), over the same total pot.
function scaleFactor(b){
  var total = totalPot(DATA && DATA.partner || {});
  var book = b && b.book;
  var mine = (book === "betmgm") ? (Number(MYBANK_MGM) || 0)
           : (book === "borgata") ? (Number(MYBANK_BGA) || 0)
           : (book === "bet365") ? (Number(MYBANK_B365) || 0)
           : (Number(MYBANK_FD) || 0);
  if (!total || !mine || mine <= 0) return 1;
  return mine / total;
}
function stake(b){
  var s = (Number(b.stake) || 0) * scaleFactor(b);
  if (BOOST15) s = s * 1.5;
  return Math.round(s * 100) / 100;
}
// Show the scaled stake prominently, with the real source stake alongside when
// scaling is active. When no bankroll is entered, just the real number.
function stakeDisplay(b){
  var real = Number(b.stake) || 0, scaled = stake(b);
  if (scaled === real) return esc(usd(real));
  return esc(usd(scaled)) + " <span class=\"real\">(" + esc(usd(real)) + ")</span>";
}
try { TAB = localStorage.getItem("pb-tab") || "bets"; } catch (e) {}
// Book filter for the To-place tab ("all" = grouped by book). Persisted like TAB.
var BOOKF = "all";
try { BOOKF = localStorage.getItem("pb-book") || "all"; } catch (e) {}
function $(id){ return document.getElementById(id); }
function esc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function am(p){ p = Number(p); return isFinite(p) ? (p > 0 ? "+" + p : String(p)) : "?"; }
function usd(x, cents){ x = Number(x || 0); var s = Math.abs(x).toFixed(cents ? 2 : 0);
  s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (x < 0 ? "-$" : "$") + s; }
function signed(x){ x = Number(x || 0); return (x > 0 ? "+" : "") + usd(x, true); }
function tm(iso){ try { return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); } catch (e) { return "?"; } }
function day(iso){ try { return new Date(iso).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); } catch (e) { return ""; } }
function mins(iso){ return Math.round((new Date(iso).getTime() - Date.now()) / 60000); }
function toast(msg, bad){ var t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : "";
  t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = "none"; }, bad ? 6000 : 2600); }
function typing(){ var a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }

function limitField(k, ed){
  var checked = ed.limited != null ? ed.limited : OPEN[k] === "limited";
  return "<label style=\"display:flex;align-items:center;gap:8px;margin-top:10px\"><input type=\"checkbox\" name=\"limited\" style=\"width:auto;margin:0\"" + (checked ? " checked" : "") + ">Book limited this bet</label>";
}

function head(){
  var d = DATA, p = d.partner;
  $("who").textContent = d.title || ((p.name || p.id) + "’s picks board");
  document.title = d.title || "Picks board";
  var fb = Number(p.nflBankroll || 0) > 0, sc = Number(p.fifaBankroll || 0) > 0, multi = fb || sc;
  $("sub").innerHTML = "eBasketball" + (fb ? " + eFootball" : "") + (sc ? " + eSoccer" : "") + " H2H &middot; FanDuel";
  $("bank").textContent = multi ? [usd(p.bankroll) + " basketball"].concat(fb ? [usd(p.nflBankroll) + " football"] : [], sc ? [usd(p.fifaBankroll) + " soccer"] : []).join(" · ") : usd(p.bankroll) + " bankroll";
  $("cap").textContent = "max " + usd(p.cap) + (multi ? " a basketball bet" : " a bet");
  var lb = $("livebk");
  var lv = d.liveBankroll || {}, parts2 = [];
  ["basketball","football","soccer"].forEach(function(lbl){
    var key = {basketball:"nba", football:"nfl", soccer:"fifa"}[lbl], L = lv[key];
    if (L) parts2.push("<b class=\"" + (L.pnl >= 0 ? "pos" : "neg") + "\">" + usd(L.h) + " " + lbl + "</b> <span class=\"" + (L.pnl >= 0 ? "pos" : "neg") + "\">(" + signed(L.pnl) + ')</span>');
  });
  if (lb) lb.innerHTML = parts2.length ? "<span class='live-tag'>LIVE:</span> " + parts2.join(" · ") : "";
    var fd = $("fdbank"), mg = $("mgmbank"), bga = $("bgabank"), b365in = $("b365bank"), bst = $("boost15");
    if (fd) fd.value = MYBANK_FD || "";
    if (mg) mg.value = MYBANK_MGM || "";
    if (bga) bga.value = MYBANK_BGA || "";
    if (b365in) b365in.value = MYBANK_B365 || "";
    if (bst) bst.checked = !!BOOST15;
    var si = $("scaleinfo"); if (si) {
      var fdf = scaleFactor({book: "fanduel"}), mgf = scaleFactor({book: "betmgm"}), gf = scaleFactor({book: "borgata"}), b36f = scaleFactor({book: "bet365"});
      var parts = [];
      if (fdf !== 1) parts.push("FanDuel ×" + (Math.round(fdf * 100) / 100));
      if (mgf !== 1) parts.push("BetMGM ×" + (Math.round(mgf * 100) / 100));
      if (gf !== 1) parts.push("Borgata ×" + (Math.round(gf * 100) / 100));

// Android: rewrite to an intent:// link with the real package so Chrome opens
// the installed app (packages verified via Google Play 2026-11-16);
// browser_fallback_url keeps mobile web as the fallback.
// iPhone (2026-11-16): the sports.* mobile domains can NEVER open the app —
// their Redirex geo layer 302s the /.well-known/apple-app-site-association
// fetch, so iOS never verifies them. But the www. domains serve the AASA
// cleanly, and it covers exactly /*/sportsapp/* (everything else excluded).
// So on iOS we rewrite the link to https://<www-domain>/en/sportsapp/sports/...
// — Safari sees the covered path and opens the installed app directly; in a
// browser the URL 302s back to the same web page, so the fallback is harmless.
function appHref(b){
  var u = b.app || "";
  if (!u || u.indexOf("https://") !== 0) return u;
  var mg = b.book === "betmgm", bga = b.book === "borgata";
  if (/Android/i.test(navigator.userAgent)) {
    var pkg = mg ? "com.playmgm.nj.sports" : (bga ? "com.borgata.nj.sports" : "");
    if (!pkg) return u;
    return "intent://" + u.slice(8) + "#Intent;scheme=https;package=" + pkg
         + ";S.browser_fallback_url=" + encodeURIComponent(u) + ";end";
  }
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    var host = mg ? "www.nj.betmgm.com" : (bga ? "www.borgataonline.com" : "");
    var m = host && u.match(/^https:\/\/sports\.[a-z.]+\/en\/sports\/(.+)$/);
    if (m) return "https://" + host + "/en/sportsapp/sports/" + m[1];
  }
  return u;
}

// Group pick cards under the book they're bet at. FanDuel first (the
// unrestricted book), then the Entain twins, then bet365 (h2hggl esoccer
// only). Within a group the global EV order is preserved.
var BOOKS = [["fanduel", "FanDuel"], ["betmgm", "BetMGM"], ["borgata", "Borgata"], ["bet365", "bet365"]];
function byBook(list){
  var g = {}, out = "";
  list.forEach(function(b){
    var k = b.book || "fanduel";
    (g[k] = g[k] || []).push(b);
  });
  BOOKS.concat(Object.keys(g).filter(function(k){
      return !BOOKS.some(function(x){ return x[0] === k; });
    }).map(function(k){ return [k, k]; }))
  .forEach(function(x){
    var rows = g[x[0]];
    if (rows && rows.length)
      out += "<h2>" + esc(x[1]) + " &middot; " + rows.length + " pick" + (rows.length > 1 ? "s" : "") + "</h2>"
           + rows.map(betCard).join("");
  });
  return out;
}

// Book filter chips at the top of the To-place tab: "All" (grouped by book)

function bookChips(counts, total){
  var books = BOOKS.filter(function(x){ return counts[x[0]]; })
    .concat(Object.keys(counts).filter(function(k){
      return !BOOKS.some(function(x){ return x[0] === k; });

  if (books.length < 2) return "";

    h += "<button class=\"chip " + esc(x[0]) + (x[0] === "fanduel" ? " fd" : x[0] === "betmgm" ? " mg" : x[0] === "borgata" ? " bga" : x[0] === "bet365" ? " b365" : "")

}

function jsonl(str){ var out = []; String(str || "").split("\n").forEach(function(l){ l = l.trim(); if (!l) return; try { out.push(JSON.parse(l)); } catch (e) {} }); return out; }

function simsStat(rows, name){
  var w=0,l=0,p=0,pnl=0,staked=0,open=0;
  rows.forEach(function(r){
    var st=r.status||r.result, s=r.stake||0;
    if(st==="open"){open++;return;}
    if(st==="win"||st==="W"||st===true){w++;pnl+=(r.pnl!=null?r.pnl:(r.price_dec?(r.price_dec-1)*s:0));staked+=s;}
    else if(st==="loss"||st==="L"||st===false){l++;pnl+=(r.pnl!=null?r.pnl:-s);staked+=s;}
    else if(st==="push"){p++;pnl+=(r.pnl||0);}
  });
  var roi=staked?Math.round(1000*pnl/staked)/10:null;
  return "<div class=\"stat\"><div class=\"k\">"+name+"</div><div class=\"v "+(pnl>0?"pos":pnl<0?"neg":"")+"\">"+esc(signed(pnl))+"</div>"
    +"<div class=\"s\">"+w+"-"+l+(p?"-"+p:"")+" &middot; "+(roi==null?"–":(roi>0?"+":"")+roi+"%")+" &middot; "+open+" open</div></div>";
}

// Slip-link buttons for an open sim row. The pipeline enriches open ledger
// rows in the /board card with links.betmgm/borgata {web, app} via the Entain
// resolver (both books share event ids). Rows without links (book doesn't
// carry the game, or bet365-only leagues the resolver can't see) get none.
// appHref() rewrites the app URL per platform exactly like the To-place tab.
// Open sims split into per-book slips: the /board card enriches open ledger
// rows with links.betmgm/borgata {web, app} (Entain resolver, both books share
// event ids), so each sim becomes a BetMGM + a Borgata twin, grouped under
// book headers and filtered with the SAME chips/state as the To-place tab
// (bookChips + shared BOOKF). Sims the books don't carry (resolver miss or
// bet365-only leagues) stay paper in the collapsed tail — no buttons, like
// the To-place tab drops uncarried rows.
function simLeft(x){
  return "<div class=\"l\"><div class=\"t\">"+esc(x.p||"")+" <span class=\"bk\">"+esc(x.src)+"</span>"+(x.lg?" <span class=\"bk\">"+esc(x.lg)+"</span>":"")+"</div>"

}
function simSlip(s){
  var mg = s.book === "betmgm";
  return "<div class=\"item\">"+simLeft(s.x)
    +"<div class=\"r slbtns\">"
    +(s.L.app?"<a class=\"btn sm"+(mg?" mg":" bga")+"\" href=\""+esc(appHref({book:s.book,app:s.L.app}))+"\" target=\"_blank\" rel=\"noopener\">App</a>":"")
    +(s.L.web?"<a class=\"btn sm\" href=\""+esc(s.L.web)+"\" target=\"_blank\" rel=\"noopener\">Browser</a>":"")
    +"</div></div>";
}
function paperRow(x){ return "<div class=\"item\">"+simLeft(x)+"</div>"; }
function simsByBook(list){
  var g = {}, out = "";
  list.forEach(function(s){ (g[s.book] = g[s.book] || []).push(s); });
  BOOKS.forEach(function(b){
    var rows = g[b[0]];
    if (rows && rows.length) out += "<h2>"+esc(b[1])+" &middot; "+rows.length+" slip"+(rows.length>1?"s":"")+"</h2><div class=\"card\">"+rows.map(simSlip).join("")+"</div>";
  });
  return out;
}

function mlProb(ml){ ml = Number(ml); if (!isFinite(ml)) return null; return ml < 0 ? -ml / (-ml + 100) : 100 / (ml + 100); }
function mlFromProb(p){ p = Math.max(0.0001, Math.min(0.9999, Number(p) || 0)); return p >= 0.5 ? -Math.round(100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); }
function shin2(b1, b2){
  var S = b1 + b2;
  function lhs(z){ var A = z * z + 4 * (1 - z) * b1 * b1 / S, B = z * z + 4 * (1 - z) * b2 * b2 / S; return Math.sqrt(A) + Math.sqrt(B) - 2; }
  var lo = 0, hi = 0.999999999, i;
  for (i = 0; i < 200; i++){ var m = (lo + hi) / 2; if (lhs(m) > 0) lo = m; else hi = m; }
  var z = (lo + hi) / 2, A = z * z + 4 * (1 - z) * b1 * b1 / S;
  return (Math.sqrt(A) - z) / (2 * (1 - z));
}
function convResults(){
  var el = $("conv-res"); if (!el) return;
  var favRaw = String(CONV_FAV || "").trim(), dogRaw = String(CONV_DOG || "").trim();
  if (!favRaw || !dogRaw) { el.innerHTML = '<div class="empty"><b>Enter both moneylines</b>Favorite (e.g. &#8722;300) and dog (e.g. +240) to see each side\u2019s Kalshi fair price.</div>'; return; }
  var fp = mlProb(favRaw), dp = mlProb(dogRaw);
  if (fp == null || dp == null || !(fp > 0 && fp < 1) || !(dp > 0 && dp < 1)) { el.innerHTML = '<div class="empty"><b>Check the lines</b>Format like &#8722;300 and +240.</div>'; return; }
  var S = fp + dp, vig = (S - 1) * 100;
  var qf = fp / S, qd = dp / S;
  var sf = shin2(fp, dp), sd = 1 - sf;
  var kask = (String(CONV_K || "").trim()) ? Number(CONV_K) : null;
  if (kask != null && !(kask > 0 && kask < 1)) kask = null;
  var h = "";
  h += '<div class="t">' + am(Number(favRaw)) + ' / ' + am(Number(dogRaw)) + '</div>';
  h += '<div class="s">Implied fav ' + (fp * 100).toFixed(1) + '% &#183; dog ' + (dp * 100).toFixed(1) + '% &#183; <b>' + (S >= 1 ? 'margin ' + vig.toFixed(2) + '%' : 'ARB ' + Math.abs(vig).toFixed(2) + '% (sum &lt; 100%)') + '</b></div>';
  h += '<div class="item"><div class="l"><div class="t">Favorite YES</div><div class="s">proportional <b>$' + qf.toFixed(3) + '</b> (fair ' + am(mlFromProb(qf)) + ') &#183; Shin <b>$' + sf.toFixed(3) + '</b> (' + am(mlFromProb(sf)) + ')</div></div></div>';
  h += '<div class="item"><div class="l"><div class="t">Dog YES</div><div class="s">proportional <b>$' + qd.toFixed(3) + '</b> (fair ' + am(mlFromProb(qd)) + ') &#183; Shin <b>$' + sd.toFixed(3) + '</b> (' + am(mlFromProb(sd)) + ')</div></div></div>';
  if (kask != null) {
    var edge = (qf - kask) * 100;
    var lean = qf >= kask ? 'buy YES (favorite underpriced on Kalshi)' : 'buy NO (favorite overpriced \u2014 take the dog side / short the favourite)';
    h += '<div class="s" style="margin-top:8px">Kalshi live YES $' + kask.toFixed(2) + ' vs fair $' + qf.toFixed(3) + ' \u2192 <b class="' + (edge >= 0 ? 'pos' : 'neg') + '">' + (edge >= 0 ? '+' : '') + edge.toFixed(1) + '\u00a2/contract</b> edge \u2014 ' + lean + '.</div>';
  } else {
    h += '<div class="s" style="margin-top:8px">Enter the live Kalshi YES price (top box) to flag the mispriced side.</div>';
  }
  el.innerHTML = h;
}

function lockOut(msg){
  // The link is locked to another device (or this browser sends no cookie). Whatever was on
  // screen goes: a device blocked while the page is open must not keep showing the bets.
  LOCKED = msg; DATA = null; REC = null;
  $("nb").textContent = "0"; $("np").textContent = "0"; $("bank").innerHTML = "&nbsp;"; $("cap").innerHTML = "&nbsp;";
  ["placed", "record"].forEach(function(t){ $("v-" + t).innerHTML = ""; $("v-" + t).hidden = true; });
  $("v-bets").hidden = false;
  $("v-bets").innerHTML = "<div class=\"empty\"><b>This board can’t be opened here</b>" + esc(msg) + "</div>";
}
function loadLive(){
  // Live P&L on the user's placed bets, written by the realtime updater.
  fetch(BASE + "/live" + QS, {cache: "no-store", credentials: "same-origin"}).then(function(r){ return r.json(); })
  .then(function(j){
    var el = $("livepnl"); if (!el) return;
    if (!j || !j.at || j.error) { el.className = "livepnl"; el.textContent = ""; return; }
    var net = Number(j.overall_net_graded) || 0;
    var n = j.graded_count || 0;
    if (!n) { el.className = "livepnl"; el.textContent = ""; return; }
    el.textContent = "Live P&L (placed): " + (net >= 0 ? "+" : "−") + esc(usd(Math.abs(net), true))
      + " · " + (j.wins||0) + "-" + (j.losses||0);
    el.className = "livepnl " + (net > 0 ? "pos" : net < 0 ? "neg" : "");
  }).catch(function(){});
}

function load(){
  return fetch(BASE + "/data" + QS, {cache: "no-store", credentials: "same-origin"}).then(function(r){
    if (r.status === 401 || r.status === 403) return r.json().then(function(j){ if (j.locked) lockOut(j.error || ""); throw new Error(j.error || "not signed in"); });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j){ LOCKED = null; DATA = j; if (!typing() && !BUSY) render(); })
  .catch(function(e){ var s = $("status"); s.className = "status down"; $("stxt").textContent = LOCKED ? "Not available on this device" : "Can’t reach the board (" + e.message + "). Retrying…"; });
}
function loadRecord(force){
  if (!force && REC && Date.now() - recAt < 60000) { renderRecord(); return; }
  fetch(BASE + "/record" + QS, {cache: "no-store", credentials: "same-origin"}).then(function(r){ return r.json(); })
  .then(function(j){ if (j && j.ok) { REC = j; recAt = Date.now(); if (TAB === "record") renderRecord(); } }).catch(function(){});
}
function act(body){
  BUSY = true;
  if (PID) body.p = PID;
  return fetch(BASE + "/act", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
  .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
  .then(function(j){ BUSY = false; return load().then(function(){ return j; }); })
  .catch(function(e){ BUSY = false; toast(e.message, true); throw e; });
}
function betBy(k){ return (DATA.bets || []).filter(function(b){ return b.key === k; })[0]; }

document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-tab],[data-act],[data-bk]"); if (!t) return;
  if (t.hasAttribute("data-tab")) { TAB = t.getAttribute("data-tab"); try { localStorage.setItem("pb-tab", TAB); } catch (e) {}
    render(); if (TAB === "record") loadRecord(false); window.scrollTo(0, 0); return; }
  if (t.hasAttribute("data-bk")) { BOOKF = t.getAttribute("data-bk"); try { localStorage.setItem("pb-book", BOOKF); } catch (e) {}
    render(); return; }
  var a = t.getAttribute("data-act"), k = t.getAttribute("data-k"), b = betBy(k);
  ev.preventDefault();
  if (a === "b365bank") {
    var v = prompt("bet365 bankroll ($)\n\nStakes on the bet365 tab scale by this bankroll, same EV proportion as the model's sizing. Clear the field to show source sizes.", MYBANK_B365 || "");
    if (v === null) return;
    MYBANK_B365 = String(v).trim();
    try { if (MYBANK_B365) localStorage.setItem("pb-b365bank", MYBANK_B365); else localStorage.removeItem("pb-b365bank"); } catch (e) {}
    var inp = document.getElementById("b365bank"); if (inp) inp.value = MYBANK_B365;
    toast(MYBANK_B365 ? "bet365 bankroll set: $" + MYBANK_B365 : "bet365 bankroll cleared — source sizes shown");
    render();
    return;
  }
  if (a === "hidetip") { try { localStorage.setItem("pb-alert-tip", k); } catch (e) {} render(); return; }
  if (a === "open" || a === "limited") { OPEN[k] = a === "limited" ? "limited" : true; if (a === "limited") EDIT[k] = Object.assign({}, EDIT[k] || {}, {amount: "", limited: true}); render(); var f = document.querySelector("form.place[data-k=\"" + CSS.escape(k) + "\"] input"); if (f) f.focus(); return; }
  if (a === "close") { delete OPEN[k]; delete EDIT[k]; if (document.activeElement) document.activeElement.blur(); render(); return; }
  if (a === "place") {
    var form = t.closest("form"), v = {};
    [].forEach.call(form.querySelectorAll("input"), function(i){ v[i.name] = i.type === "checkbox" ? i.checked : i.value.trim(); });
    if (document.activeElement) document.activeElement.blur();
    act({action: "place", key: k, amount: v.amount, price: v.price, line: v.line, limited: v.limited, side: b ? b.side : null})
      .then(function(){ delete OPEN[k]; delete EDIT[k]; toast("Recorded: " + (b ? b.side : "bet") + " for $" + v.amount); render(); }).catch(function(){});
    return;
  }
  if (a === "skip") { if (DATA.role !== "admin" && !confirm("Skip " + (b ? b.side : "this bet") + "? You can’t undo this — only Matt can change it.")) return;
    act({action: "skip", key: k, side: b ? b.side : null}).then(function(){ toast("Skipped — undo it under Placed"); render(); }).catch(function(){}); return; }
  if (a === "undo") { act({action: "undo", key: k}).then(function(){ toast("Undone"); render(); if (TAB === "record") loadRecord(true); }).catch(function(){}); return; }
});
document.addEventListener("input", function(ev){
  if (ev.target && (ev.target.id === "cvf" || ev.target.id === "cvd" || ev.target.id === "cvk")) {
    var v = ev.target.value.trim();
    if (ev.target.id === "cvf") CONV_FAV = v; else if (ev.target.id === "cvd") CONV_DOG = v; else CONV_K = v;
    convResults();
    return;
  }
  if (ev.target && ev.target.id === "fdbank") {
    MYBANK_FD = ev.target.value.trim();
    try { if (MYBANK_FD) localStorage.setItem("pb-fdbank", MYBANK_FD); else localStorage.removeItem("pb-fdbank"); } catch (e) {}
    render();
    return;
  }
  if (ev.target && ev.target.id === "mgmbank") {
    MYBANK_MGM = ev.target.value.trim();
    try { if (MYBANK_MGM) localStorage.setItem("pb-mgmbank", MYBANK_MGM); else localStorage.removeItem("pb-mgmbank"); } catch (e) {}
    render();
    return;
  }
  if (ev.target && ev.target.id === "bgabank") {
    MYBANK_BGA = ev.target.value.trim();
    try { if (MYBANK_BGA) localStorage.setItem("pb-bgabank", MYBANK_BGA); else localStorage.removeItem("pb-bgabank"); } catch (e) {}
    render();
    return;
  }
  if (ev.target && ev.target.id === "b365bank") {
    MYBANK_B365 = ev.target.value.trim();
    try { if (MYBANK_B365) localStorage.setItem("pb-b365bank", MYBANK_B365); else localStorage.removeItem("pb-b365bank"); } catch (e) {}
    render();
    return;
  }
  if (ev.target && ev.target.id === "boost15") {
    BOOST15 = ev.target.checked;
    try { if (BOOST15) localStorage.setItem("pb-boost15", "1"); else localStorage.removeItem("pb-boost15"); } catch (e) {}
    render();
    return;
  }
  var f = ev.target.closest("form.place"); if (!f) return;
  var k = f.getAttribute("data-k"); EDIT[k] = EDIT[k] || {}; EDIT[k][ev.target.name] = ev.target.type === "checkbox" ? ev.target.checked : ev.target.value;
});
// ENTER IN A FIELD SUBMITS THE FORM, which would reload the page and lose the entry. Route it to the
// same Confirm button instead. (No re-render on blur: a render between blur and click can replace
// the button being tapped; the 15 s poll catches up once nothing is focused.)
document.addEventListener("submit", function(ev){ ev.preventDefault();
  var btn = ev.target.querySelector("[data-act=place]"); if (btn) btn.click(); });
document.addEventListener("visibilitychange", function(){
  if (document.hidden) return;
  // Wake-from-sleep: the timer dies when the laptop sleeps and does not resume.
  // If our data is stale (>4 min) the JS may be wedged - force a full reload.
  var lastSeen = DATA && (DATA.checkedAt || DATA.at);
  if (lastSeen && (Date.now() - new Date(lastSeen).getTime() > 4*60*1000)) { location.reload(); return; }
  load(); loadLive(); if (TAB === "record") loadRecord(false);
});
load(); setInterval(load, 15000);
setInterval(function(){ if (DATA && !typing() && !BUSY) render(); }, 30000);
setInterval(loadLive, 15000);
if (TAB === "record") loadRecord(false);
})();
</script>
<script>
(function(){
  var b = document.createElement("button");
  b.textContent = "Account";
  b.style.cssText = "position:fixed;bottom:12px;right:12px;z-index:99;padding:9px 16px;border:0;border-radius:8px;background:#16201a;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)";
  function post(body, okmsg){
    fetch("/act",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",
      body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .then(function(j){ alert(j.ok ? okmsg : "Failed: " + (j.error || "unknown error")); })
      .catch(function(e){ alert("Request failed: " + e); });
  }
  b.onclick = function(){
    var c = prompt("Picks board account\n\n1 = Change my password\n2 = Create a friend account (admin)\n\nEnter 1 or 2:");
    if (c === "1") {
      var cur = prompt("Current password:");
      if (!cur) return;
      var nw = prompt("New password (8+ characters):");
      if (!nw || nw.length < 8) { alert("New password must be at least 8 characters."); return; }
      post({act:"set_password", current:cur, new:nw}, "Password changed \u2713 Use it at your next login.");
    } else if (c === "2") {
      if (!DATA || DATA.role !== "admin") { alert("Only the admin can create accounts."); return; }
      var u = prompt("New username:");
      if (!u || !/^[A-Za-z0-9_.-]{2,30}$/.test(u)) { alert("Username: 2-30 letters/numbers/dots/dashes."); return; }
      var p2 = prompt("Temporary password for " + u + " (8+ characters):");
      if (!p2 || p2.length < 8) { alert("Password must be at least 8 characters."); return; }
      post({act:"admin_create_user", username:u, password:p2},
        "User '" + u + "' created \u2713 Share the board URL + these credentials privately. " + u + " should change the password after first login.");
    }
  };
  document.body.appendChild(b);
})();
</script>
